[project]
name = "arena_casper"
version = "0.0.0"
dependencies = [
    "attrs",
    "casper",
    "pyyaml",
    "shapely",
]
dynamic = ["description", "license", "maintainers", "scripts", "entry-points"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network'"
markers = [
    "ros: requires a sourced ROS2 environment",
    "network: hits the live upstream host",
]
